name: Donka Pull
description: Download a release artifact from Donka Studio so a pipeline can publish it to your own infrastructure
branding:
  icon: download
  color: blue

inputs:
  url:
    description: Donka Studio URL, e.g. https://donka.bank.example
    required: true
  token:
    description: CI token from the project's settings. Pass a secret, never a literal
    required: true
  project:
    description: Project key or id
    required: true
  target:
    description: "'main' (newest release), 'commit:<release id>', 'release:<version>' or 'env:<staging|production>'"
    required: false
    default: main
  out:
    description: Output directory
    required: false
    default: .
  name:
    description: Output file name, or sub-directory name when unpack is true. Defaults to the project key with no extension
    required: false
    default: ''
  unpack:
    description: Extract the archive instead of writing it
    required: false
    default: 'false'
  delete:
    description: With unpack, delete files in the destination that are not in the artifact so it mirrors the target exactly
    required: false
    default: 'false'
  current:
    description: The commit id from a previous pull. When it still matches, nothing is downloaded and changed is false
    required: false
    default: ''
  cli-version:
    description: Version of the Donka CLI to run, from its GitHub release. Pin this in production
    required: false
    default: 0.3.3 # x-release-please-version
  cli-package:
    description: Run this package instead of the GitHub release, e.g. a copy of donka-cli-X.Y.Z.tgz on an internal mirror
    required: false
    default: ''

outputs:
  project:
    description: Project that was pulled
    value: ${{ steps.pull.outputs.project }}
  target:
    description: Target that was pulled
    value: ${{ steps.pull.outputs.target }}
  changed:
    description: 'false when the target still matches the current input, true when an artifact was downloaded'
    value: ${{ steps.pull.outputs.changed }}
  release:
    description: Release id the target resolved to
    value: ${{ steps.pull.outputs.release }}
  version:
    description: Release version the target resolved to
    value: ${{ steps.pull.outputs.version }}
  commit:
    description: Id to pass as current on the next run (the release id, or the deployment id for env targets)
    value: ${{ steps.pull.outputs.commit }}
  sha256:
    description: Checksum of the downloaded artifact
    value: ${{ steps.pull.outputs.sha256 }}
  files:
    description: JSON array of the paths written
    value: ${{ steps.pull.outputs.files }}

runs:
  using: composite
  steps:
    - id: pull
      shell: bash
      env:
        # Credentials travel as environment, never as arguments: anything on
        # the command line is visible to other processes and lands in traces.
        DONKA_URL: ${{ inputs.url }}
        DONKA_TOKEN: ${{ inputs.token }}
        DONKA_PROJECT: ${{ inputs.project }}
        DONKA_TARGET: ${{ inputs.target }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_UNPACK: ${{ inputs.unpack }}
        INPUT_DELETE: ${{ inputs.delete }}
        INPUT_CURRENT: ${{ inputs.current }}
        CLI_VERSION: ${{ inputs['cli-version'] }}
        CLI_PACKAGE: ${{ inputs['cli-package'] }}
      run: |
        set -euo pipefail
        echo "::add-mask::$DONKA_TOKEN"

        if [ -z "$DONKA_PROJECT" ]; then
          echo "The project input is required." >&2
          exit 2
        fi
        package="${CLI_PACKAGE:-https://github.com/youmssi/donka-cli/releases/download/v${CLI_VERSION}/donka-cli-${CLI_VERSION}.tgz}"

        args=(pull --out "$INPUT_OUT" --json)
        [ -n "$INPUT_NAME" ] && args+=(--name "$INPUT_NAME")
        [ -n "$INPUT_CURRENT" ] && args+=(--current "$INPUT_CURRENT")
        [ "$INPUT_UNPACK" = "true" ] && args+=(--unpack)
        [ "$INPUT_DELETE" = "true" ] && args+=(--delete)

        echo "project=$DONKA_PROJECT" >> "$GITHUB_OUTPUT"
        echo "target=${DONKA_TARGET:-main}" >> "$GITHUB_OUTPUT"

        result="$RUNNER_TEMP/donka-pull.json"

        # Exit 3 means the target has not moved. That is a normal outcome for a
        # scheduled job, so it becomes an output rather than a failed step.
        set +e
        npx --yes --package "$package" donka "${args[@]}" > "$result"
        code=$?
        set -e

        if [ "$code" -eq 3 ]; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Target unchanged, nothing downloaded."
          exit 0
        fi
        [ "$code" -ne 0 ] && exit "$code"

        echo "changed=true" >> "$GITHUB_OUTPUT"
        for key in release version commit sha256; do
          echo "$key=$(jq -r --arg k "$key" '.[$k] // ""' "$result")" >> "$GITHUB_OUTPUT"
        done
        echo "files=$(jq -c '.files' "$result")" >> "$GITHUB_OUTPUT"
