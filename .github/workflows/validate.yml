name: 'Validate'

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  codequality:
    name: 'Code quality'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - name: 'Lint'
        run: pnpm lint

      - name: 'Format'
        run: pnpm format

      - name: 'Typecheck'
        run: pnpm typecheck

      - name: 'Build'
        run: pnpm build

      - name: 'Test'
        run: pnpm test

  action:
    name: 'GitHub action'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: true

      - name: Pack the CLI and start a fake Studio
        id: pack
        run: |
          pnpm build
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "package=$(ls "$RUNNER_TEMP"/donka-cli-*.tgz)" >> "$GITHUB_OUTPUT"
          node test/serve.ts 4949 &
          sleep 1

      - uses: ./actions/pull
        id: pull
        with:
          url: http://127.0.0.1:4949
          token: dnk_ci_test-secret-value
          project: credit-pme
          target: env:staging
          out: ${{ runner.temp }}/rules
          cli-package: ${{ steps.pack.outputs.package }}

      - uses: ./actions/pull
        id: unchanged
        with:
          url: http://127.0.0.1:4949
          token: dnk_ci_test-secret-value
          project: credit-pme
          target: env:staging
          current: ${{ steps.pull.outputs.commit }}
          out: ${{ runner.temp }}/rules
          cli-package: ${{ steps.pack.outputs.package }}

      - name: Check the outputs
        env:
          CHANGED: ${{ steps.pull.outputs.changed }}
          VERSION: ${{ steps.pull.outputs.version }}
          UNCHANGED: ${{ steps.unchanged.outputs.changed }}
        run: |
          test "$CHANGED" = true
          test "$VERSION" = 1.0.0
          test "$UNCHANGED" = false
          test -f "$RUNNER_TEMP/rules/credit-pme"

      - name: Write a form from release 1.0.0's contract
        run: |
          node dist/main.js form pull --target release:1.0.0 --decision loan --out "$RUNNER_TEMP/contracts"
          node dist/main.js form init --contract "$RUNNER_TEMP/contracts/loan/input.schema.json" --out "$RUNNER_TEMP/loan-form.json"
        env:
          DONKA_URL: http://127.0.0.1:4949
          DONKA_TOKEN: dnk_ci_test-secret-value
          DONKA_PROJECT: credit-pme

      - uses: ./actions/form-check
        id: matches
        with:
          url: http://127.0.0.1:4949
          token: dnk_ci_test-secret-value
          project: credit-pme
          target: release:1.0.0
          decision: loan
          form: ${{ runner.temp }}/loan-form.json
          cli-package: ${{ steps.pack.outputs.package }}

      # 1.1.0 adds a required field the form lacks, so this check must fail.
      - uses: ./actions/form-check
        id: drifted
        continue-on-error: true
        with:
          url: http://127.0.0.1:4949
          token: dnk_ci_test-secret-value
          project: credit-pme
          target: main
          decision: loan
          form: ${{ runner.temp }}/loan-form.json
          cli-package: ${{ steps.pack.outputs.package }}

      - name: Check the form check outcomes
        env:
          MATCHES: ${{ steps.matches.outputs.differences }}
          DRIFTED: ${{ steps.drifted.outcome }}
          DIFFERENCES: ${{ steps.drifted.outputs.differences }}
        run: |
          test "$MATCHES" = '[]'
          test "$DRIFTED" = failure
          test "$(echo "$DIFFERENCES" | jq -r '.[0].field')" = loan.termMonths
