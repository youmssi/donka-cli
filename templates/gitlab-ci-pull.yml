# GitLab CI template: pull a Donka release artifact and publish it to your own storage.
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/youmssi/donka-cli/v0.3.3/templates/gitlab-ci-pull.yml' # x-release-please-version
#
#   pull:rules:
#     extends: .donka-pull
#     variables:
#       DONKA_PROJECT: credit-pme
#       DONKA_TARGET: env:production
#
# DONKA_URL and DONKA_TOKEN come from CI/CD variables; mask and protect the token
# (a CI token issued in the project's settings). GitLab puts CI/CD variables in
# the environment automatically, so the CLI picks them up with no further wiring.

.donka-pull:
  image: node:24-alpine
  variables:
    DONKA_TARGET: main
    DONKA_OUT: dist
    DONKA_CLI_VERSION: '0.3.3' # x-release-please-version
    # Runs this package instead of the GitHub release, e.g. an internal mirror
    DONKA_CLI_PACKAGE: ''
    DONKA_UNPACK: 'false'
    # 'true' deletes files in the destination that are not in the artifact
    DONKA_DELETE: 'false'
  script:
    - |
      set -eu

      if [ -z "${DONKA_PROJECT:-}" ]; then
        echo "Set DONKA_PROJECT to the project key." >&2
        exit 2
      fi
      package="${DONKA_CLI_PACKAGE:-https://github.com/youmssi/donka-cli/releases/download/v${DONKA_CLI_VERSION}/donka-cli-${DONKA_CLI_VERSION}.tgz}"

      set -- pull --out "$DONKA_OUT" --json
      if [ -n "${DONKA_NAME:-}" ]; then set -- "$@" --name "$DONKA_NAME"; fi
      if [ -n "${DONKA_CURRENT:-}" ]; then set -- "$@" --current "$DONKA_CURRENT"; fi
      if [ "${DONKA_UNPACK}" = "true" ]; then set -- "$@" --unpack; fi
      if [ "${DONKA_DELETE}" = "true" ]; then set -- "$@" --delete; fi

      # Exit 3 means the target has not moved: a normal outcome, not a failure
      set +e
      npx --yes --package "$package" donka "$@" > result.json
      code=$?
      set -e

      if [ "$code" -eq 3 ]; then
        {
          echo "RULES_CHANGED=false"
          echo "RULES_PROJECT=${DONKA_PROJECT}"
          echo "RULES_TARGET=${DONKA_TARGET:-main}"
        } > donka.env
        echo "Target unchanged, nothing downloaded."
        exit 0
      fi
      if [ "$code" -ne 0 ]; then exit "$code"; fi

      {
        echo "RULES_CHANGED=true"
        echo "RULES_PROJECT=${DONKA_PROJECT}"
        echo "RULES_TARGET=${DONKA_TARGET:-main}"
        node -e 'const r=require("./result.json");console.log("RULES_VERSION="+(r.version||""));console.log("RULES_RELEASE="+(r.release||""));console.log("RULES_COMMIT="+(r.commit||""));console.log("RULES_SHA256="+(r.sha256||""))'
      } > donka.env
      cat donka.env
  artifacts:
    paths:
      - $DONKA_OUT
    # Downstream jobs read RULES_CHANGED / RULES_VERSION as ordinary variables
    reports:
      dotenv: donka.env
