# Azure Pipelines steps template: pull a Donka release artifact for your own publish step.
#
#   resources:
#     repositories:
#       - repository: donka
#         type: github
#         name: youmssi/donka-cli
#         ref: refs/tags/v0.3.3 # x-release-please-version
#         endpoint: <your GitHub service connection>
#
#   jobs:
#     - job: deploy_rules
#       pool:
#         vmImage: ubuntu-latest
#       steps:
#         - template: templates/azure-pipelines-pull.yml@donka
#           parameters:
#             url: https://donka.bank.example
#             project: credit-pme
#             target: env:production
#         - script: <publish $(Build.ArtifactStagingDirectory)/rules however you deploy>
#
# The template only pulls: it downloads the artifact and sets result variables
# (rulesChanged, rulesProject, rulesTarget, rulesVersion, rulesRelease,
# rulesCommit, rulesSha256) for the steps you add after it. Publishing is yours.
#
# DONKA_TOKEN must exist as a secret variable (a CI token issued in the
# project's settings), either in the pipeline or in a linked variable group.

parameters:
  - name: url
    type: string
  - name: project
    type: string
  - name: target
    type: string
    default: main
  - name: out
    type: string
    default: $(Build.ArtifactStagingDirectory)/rules
  - name: name
    type: string
    default: ''
  - name: unpack
    type: boolean
    default: false
  # With unpack, deletes files in the destination that are not in the artifact
  - name: delete
    type: boolean
    default: false
  # The commit id from a previous pull; when unchanged, rulesChanged is 'false'
  - name: current
    type: string
    default: ''
  - name: cliVersion
    type: string
    default: 0.3.3 # x-release-please-version
  # Runs this package instead of the GitHub release, e.g. an internal mirror
  - name: cliPackage
    type: string
    default: ''

steps:
  # Microsoft-hosted images already ship Node; self-hosted agents may not.
  - task: NodeTool@0
    displayName: Use Node 24
    inputs:
      versionSpec: '24.x'

  - script: |
      set -euo pipefail

      package="${{ parameters.cliPackage }}"
      if [ -z "$package" ]; then
        package="https://github.com/youmssi/donka-cli/releases/download/v${{ parameters.cliVersion }}/donka-cli-${{ parameters.cliVersion }}.tgz"
      fi

      args=(pull --out "${{ parameters.out }}" --json)
      if [ -n "${{ parameters.name }}" ]; then args+=(--name "${{ parameters.name }}"); fi
      if [ -n "${{ parameters.current }}" ]; then args+=(--current "${{ parameters.current }}"); fi
      if [ "${{ lower(parameters.unpack) }}" = "true" ]; then args+=(--unpack); fi
      if [ "${{ lower(parameters.delete) }}" = "true" ]; then args+=(--delete); fi

      # Exit 3 means the target has not moved: a normal outcome, not a failure
      set +e
      npx --yes --package "$package" donka "${args[@]}" > result.json
      code=$?
      set -e

      echo "##vso[task.setvariable variable=rulesProject]${DONKA_PROJECT}"
      echo "##vso[task.setvariable variable=rulesTarget]${DONKA_TARGET:-main}"

      if [ "$code" -eq 3 ]; then
        echo "##vso[task.setvariable variable=rulesChanged]false"
        echo "Target unchanged, nothing downloaded."
        exit 0
      fi
      [ "$code" -ne 0 ] && exit "$code"

      echo "##vso[task.setvariable variable=rulesChanged]true"
      echo "##vso[task.setvariable variable=rulesVersion]$(node -p "require('./result.json').version || ''")"
      echo "##vso[task.setvariable variable=rulesRelease]$(node -p "require('./result.json').release || ''")"
      echo "##vso[task.setvariable variable=rulesCommit]$(node -p "require('./result.json').commit || ''")"
      echo "##vso[task.setvariable variable=rulesSha256]$(node -p "require('./result.json').sha256 || ''")"
    displayName: donka pull
    env:
      DONKA_URL: ${{ parameters.url }}
      DONKA_PROJECT: ${{ parameters.project }}
      DONKA_TARGET: ${{ parameters.target }}
      # Secret variables are NOT mapped into the environment automatically;
      # without this line the token is simply absent.
      DONKA_TOKEN: $(DONKA_TOKEN)
